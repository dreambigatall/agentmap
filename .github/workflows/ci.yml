name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres so the workspace-isolation tests run on every change.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillflow?schema=app
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/skillflow?schema=app
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillflow/shared build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
